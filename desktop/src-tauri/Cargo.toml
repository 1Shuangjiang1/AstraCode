[package]
name = "astracode-workbench"
version = "0.8.1"
description = "Local desktop coding agent with plans, permissions, verification and file previews"
authors = ["AstraCode contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
